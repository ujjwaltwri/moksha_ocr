name: moksha_gate
description: Gate scanner for Moksha entry — scans signed QR passes, works offline.
publish_to: "none"

# Bump the build number (after +) for every upload to TestFlight / Play.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera QR scanning (ML Kit on Android, Apple Vision on iOS)
  mobile_scanner: ^7.0.1
  # Ed25519 signature check, pure Dart
  cryptography: ^2.7.0
  # Local pass list and check-in log
  sqflite: ^2.4.1
  path: ^1.9.0
  # Server calls
  http: ^1.2.2
  # Settings and the device token
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  # Keep the screen on while scanning
  wakelock_plus: ^1.2.8
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Screen tests run against a real SQLite database on the laptop
  sqflite_common_ffi: ^2.3.4
  # App icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/nsut_logo.png

# Regenerate after changing the source images: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
