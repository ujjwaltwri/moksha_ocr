name: moksha_gate
description: Gate scanner for Moksha entry — scans signed QR passes, works offline.
publish_to: "none"

# Bump the build number (after +) for every upload to TestFlight / Play.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera QR scanning (ML Kit on Android, Apple Vision on iOS)
  mobile_scanner: ^7.0.1
  # Ed25519 signature check, pure Dart
  cryptography: ^2.7.0
  # Local pass list and check-in log
  sqflite: ^2.4.1
  path: ^1.9.0
  # Server calls
  http: ^1.2.2
  # Settings and the device token
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  # Keep the screen on while scanning
  wakelock_plus: ^1.2.8
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
